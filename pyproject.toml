[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quorumguard"
version = "0.1.0"
description = "Claim-Genealogy-Gated Hedged Quorums and Priority-Budget Straggler Boosting for Asynchronous Multi-Agent LLM Consensus"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohammed Kamran Syed", email = "mohammedkamran.syed@ieee.org" },
    { name = "Anudeep Rentala", email = "anudeep.rentala@ieee.org" },
    { name = "Somesh Rahul", email = "someshrahul@ieee.org" },
    { name = "Raghuram Malpe Pai", email = "raghuram.pai@ieee.org" },
    { name = "Krishna Suman Dara", email = "krishna-suman.dara@ieee.org" },
]
keywords = [
    "multi-agent-systems",
    "llm-consensus",
    "quorum-systems",
    "tail-latency",
    "epistemic-uncertainty",
    "error-cascades",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
pilot = ["numpy>=1.24", "torch>=2.1", "transformers>=4.45"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["quorumguard*"]
